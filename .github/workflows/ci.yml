name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libgtk-3-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel 2

      - name: Test
        run: ctest --preset ci

      - name: Package (Windows ZIP)
        if: runner.os == 'Windows'
        run: cpack --config build-ci/CPackConfig.cmake -G ZIP -B build-ci

      - name: Package
        if: runner.os != 'Windows'
        run: cmake --build --preset ci --target package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instrument-${{ matrix.os }}
          path: |
            build-ci/*.exe
            build-ci/*.pkg
            build-ci/*.deb
            build-ci/*.zip
            build-ci/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instrument-*
          path: release-artifacts
          merge-multiple: false

      - name: Create SHA-256 checksums
        run: |
          find release-artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
